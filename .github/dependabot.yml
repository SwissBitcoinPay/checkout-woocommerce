# Pull requests that keep the actions and the Composer dependencies up to date: one per ecosystem
# (each group takes every update of its ecosystem), each a week after a release (cooldown): time
# for a compromised release to be found and yanked before it reaches this repository.
#
# Not here, updated by hand (README.md, "Development"): the WordPress and WooCommerce versions the
# tests run on (tools/downloads.sh, tools/tests/wordpress.sh, the workflows' matrices), pinned at
# several versions on purpose; the tools the CI downloads (PHP, Composer, Strauss, WP-CLI, Plugin
# Check, MariaDB, the Docker images), pinned with their checksums.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      composer:
        patterns: ["*"]
    commit-message:
      prefix: build
    ignore:
      # The SDK is the copy pinned in sdk/: tools/sdk.php imports a new commit of it.
      - dependency-name: sattleme/checkout
      # WordPress's PHPUnit test library supports PHPUnit up to 9.6.
      - dependency-name: phpunit/phpunit
        update-types: ["version-update:semver-major"]
